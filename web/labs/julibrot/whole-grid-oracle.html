<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ember Julibrot whole-grid oracle</title>
  <style>
    body { margin: 0; background: #101014; color: #e8e8ea; font: 13px/1.5 ui-monospace, monospace; }
    canvas { display: block; }
    pre { margin: 0; padding: 12px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <canvas id="julibrot" width="960" height="540"></canvas>
  <pre id="report">opening the served build</pre>
  <script type="module">
    // This test-only page runs one shipped row through the public lab driver and prints the exact
    // fixture shape used for later whole-grid comparisons. Its measured captures use fixed direct
    // refresh turns after settlement, so a hidden tab cannot add policy samples. `?generate=1`
    // takes preset zero from the served wasm; without it, the committed fixture supplies the
    // frozen row and comparison.
    import { openLab } from "./lab.js?v=1";

    const FIXTURE_URL = "./whole-grid-v1.json";
    const LOSSLESS_FILE = "whole-grid-v1.rgba.deflate.bin";
    const LOSSLESS_ENCODING = "zlib-rfc1950";
    const MAX_INLINE_BINARY_BYTES = 600_000;
    const FIXED_POLICY_PRESENT_COUNT = 2;
    const REFRESHES_PER_PRESENT = 3;
    const CALLBACK_WAIT_MS = 1_000;
    const MEASUREMENT_WALL_MS = 5_000;
    const READBACK_POLL_MS = 250;
    const READBACK_TIMEOUT_MS = 120_000;
    const CANVAS = document.getElementById("julibrot");
    const REPORT = document.getElementById("report");
    const GENERATING = new URLSearchParams(globalThis.location.search).get("generate") === "1";
    const ENVIRONMENT_FIELDS = ["adapter_name", "backend"];
    const PAGE_WALL_FIELDS = [
      "worker_compute_us",
      "worker_overfeed_us",
      "scene_wall_ms",
      "scene_fence_wait_ms",
      "scene_callback_observation_wall_ms",
      "scene_fence_callback_observation_wait_ms",
      "warp_wall_ms",
      "warp_fence_wait_ms",
      "warp_callback_observation_wall_ms",
      "warp_fence_callback_observation_wait_ms",
      "timer_quantum_ms",
    ];
    const WORKER_WALL_FIELDS = ["last_compute_us", "last_overfeed_us"];
    const LEVEL_WALL_FIELDS = [
      "dispatch_us",
      "scene_us",
      "warp_us",
      "scene_callback_observation_us",
      "warp_callback_observation_us",
      "worker_reference_us",
      "worker_generation_us",
      "credit_wait_us",
      "request_transfer_us",
      "worker_round_trip_callback_observation_us",
      "acceptance_us",
      "reference_upload_us",
    ];

    function omit(record, fields) {
      for (const field of fields) delete record[field];
    }

    // S-05 normalization removes only named wall durations and environment strings. Credit, polls,
    // ids, epochs, modes, extents, byte counts, queue depths and policy results stay exact.
    function stableFacts(facts) {
      const stable = JSON.parse(JSON.stringify(facts));
      omit(stable, ENVIRONMENT_FIELDS);
      omit(stable, PAGE_WALL_FIELDS);
      if (stable.worker_facts) omit(stable.worker_facts, WORKER_WALL_FIELDS);
      if (Array.isArray(stable.level_timings)) {
        for (const level of stable.level_timings) omit(level, LEVEL_WALL_FIELDS);
      }
      return stable;
    }

    function fnv1a64(bytes) {
      let hash = 0xcbf29ce484222325n;
      const prime = 0x100000001b3n;
      for (const byte of bytes) hash = BigInt.asUintN(64, (hash ^ BigInt(byte)) * prime);
      return hash.toString(16).padStart(16, "0");
    }

    async function sha256(bytes) {
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      return Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, "0")).join("");
    }

    async function deflate(bytes) {
      // WHATWG's `deflate` format is an RFC 1950 zlib wrapper around the deflate payload.
      const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate"));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    async function inflate(bytes) {
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    function base64(bytes) {
      let binary = "";
      const chunkBytes = 32_768;
      for (let offset = 0; offset < bytes.length; offset += chunkBytes) {
        binary += String.fromCharCode(...bytes.subarray(offset, offset + chunkBytes));
      }
      return btoa(binary);
    }

    function equalBytes(actual, expected) {
      return actual.length === expected.length && actual.every((byte, index) => byte === expected[index]);
    }

    // SHA-256 authenticates the complete raw frame. Ordered row digests remain only as compact
    // mismatch localizers; the deflate fixture is the lossless source of expected pixel bytes.
    function rgbaRowDigests(bytes, width, height) {
      const bytesPerRow = width * 4;
      assert(bytes.length === bytesPerRow * height, "RGBA rows need the declared extent");
      const rows = [];
      for (let row = 0; row < height; row += 1) {
        const start = row * bytesPerRow;
        rows.push(fnv1a64(bytes.subarray(start, start + bytesPerRow)));
      }
      return rows;
    }

    function assert(condition, message) {
      if (!condition) throw new Error(message);
    }

    async function loadExpected() {
      const response = await fetch(FIXTURE_URL, { cache: "no-store" });
      if (!response.ok) throw new Error(`fixture request returned ${response.status}`);
      return response.json();
    }

    async function loadLossless(expected) {
      const descriptor = expected.rgba.lossless;
      assert(descriptor.file === LOSSLESS_FILE, "fixture names an unexpected lossless file");
      assert(descriptor.encoding === LOSSLESS_ENCODING, "fixture names an unexpected lossless encoding");
      const response = await fetch(`./${descriptor.file}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`lossless fixture request returned ${response.status}`);
      const compressed = new Uint8Array(await response.arrayBuffer());
      assert(compressed.length === descriptor.byte_length, "lossless fixture byte length differs");
      return compressed;
    }

    const pause = durationMs => new Promise(resolve => setTimeout(resolve, durationMs));

    function captureState(api) {
      return JSON.parse(api.app_frame_capture_json());
    }

    function refreshClock(api) {
      let nowMs = performance.now();
      let refreshCount = 0;
      return {
        advance(deltaMs) {
          nowMs += deltaMs;
          api.app_refresh(nowMs);
          refreshCount += 1;
          return JSON.parse(api.app_facts_json());
        },
        poll() {
          api.app_refresh(nowMs);
          return JSON.parse(api.app_facts_json());
        },
        count() {
          return refreshCount;
        },
      };
    }

    function assertNoPresentation(facts, presentedFacts) {
      assert(
        JSON.stringify(facts.presentation_ledger) ===
          JSON.stringify(presentedFacts.presentation_ledger),
        "readback polling submitted an additional presentation",
      );
      assert(
        facts.completed_scene_id === presentedFacts.completed_scene_id &&
          facts.presented_scene_id === presentedFacts.presented_scene_id,
        "readback polling changed the completed or presented scene",
      );
    }

    async function takeFixedFrame(api, clock, presentedFacts) {
      const deadline = performance.now() + READBACK_TIMEOUT_MS;
      for (;;) {
        const state = captureState(api);
        assert(
          !state.frame_capture_refusal,
          `frame capture was refused: ${state.frame_capture_refusal}`,
        );
        if (state.frame_capture_ready) {
          const bytes = api.app_take_frame_rgba();
          assert(bytes, "fixed capture completed without RGBA bytes");
          assert(
            bytes.length === state.frame_capture_width * state.frame_capture_height * 4,
            "fixed capture byte count differs from its extent",
          );
          return {
            width: state.frame_capture_width,
            height: state.frame_capture_height,
            route: state.frame_capture_copy_route,
            scene_id: state.frame_capture_scene_id,
            rgba: bytes,
          };
        }
        assert(performance.now() <= deadline, "fixed frame readback timed out");
        await pause(READBACK_POLL_MS);
        assertNoPresentation(clock.poll(), presentedFacts);
      }
    }

    async function presentOnFixedTurns(api, clock, expectedSampleClass, capture) {
      if (capture) {
        const support = captureState(api);
        assert(
          support.frame_capture_supported,
          `frame capture is unavailable: ${support.frame_capture_status}`,
        );
        assert(
          !support.frame_capture_pending && !support.frame_capture_ready,
          "a prior frame capture is still held",
        );
        api.app_request_frame_capture();
      }
      api.app_request_frame();

      clock.advance(1);

      // No browser callback can run between these two calls. This fixes the first fence
      // observation as pending instead of letting animation scheduling decide the poll count.
      clock.advance(1);

      // The callback gets one real-time window, then a bounded synthetic wall makes this warp the
      // newest policy sample without crossing the frame-copy deadline. A missing warp callback
      // refuses this fixed presentation instead of adding timing-dependent presentation turns.
      await pause(CALLBACK_WAIT_MS);
      const facts = clock.advance(MEASUREMENT_WALL_MS);
      assert(facts.refresh_status === "Presented", "fixed presentation missed its completion turn");
      assert(
        facts.warmup_label === expectedSampleClass,
        `fixed presentation expected ${expectedSampleClass}, got ${facts.warmup_label}`,
      );
      return {
        frame: capture ? await takeFixedFrame(api, clock, facts) : null,
        facts,
      };
    }

    async function measuredFrame(lab) {
      // The final settled presentation supplies the cold sample. Stop the driver's animation and
      // fallback schedulers, then contribute exactly the policy probe and measured presentations.
      // Only the latter is captured; variable readback polls happen after its facts are frozen.
      lab.stop();
      const clock = refreshClock(lab.api);
      await presentOnFixedTurns(lab.api, clock, "PolicyProbe", false);
      const measured = await presentOnFixedTurns(lab.api, clock, "Measured", true);
      assert(
        clock.count() === FIXED_POLICY_PRESENT_COUNT * REFRESHES_PER_PRESENT,
        "fixed presentation refresh count differs",
      );
      return {
        ...measured,
        presentCount: FIXED_POLICY_PRESENT_COUNT,
        refreshCount: clock.count(),
      };
    }

    async function run() {
      const expected = GENERATING ? null : await loadExpected();
      const lab = await openLab({ canvas: CANVAS });
      try {
        const row = expected ? expected.row.value : JSON.parse(lab.api.app_preset(0));
        lab.applyRow(row);
        await lab.settle({ level: "Final" });
        const measured = await measuredFrame(lab);
        const { frame, facts } = measured;
        assert(facts.warmup_label === "Measured", "captured frame is not in the deliberate sample class");
        assert(frame.scene_id === (facts.completed_scene_id ?? null), "copied and completed scene ids differ");
        assert(frame.rgba.length === frame.width * frame.height * 4, "RGBA byte count does not match the extent");
        const stable = stableFacts(facts);
        const compressed = GENERATING ? await deflate(frame.rgba) : await loadLossless(expected);
        if (expected) {
          const fixtureRgba = await inflate(compressed);
          assert(equalBytes(frame.rgba, fixtureRgba), "served RGBA differs from the lossless fixture");
        }
        const actual = {
          schema: 2,
          row: { id: "preset:0", value: row },
          route: frame.route,
          extent: [frame.width, frame.height],
          copied_scene_id: frame.scene_id,
          completed_scene_id: facts.completed_scene_id ?? null,
          stable_facts: stable,
          determinism: {
            warmup_label: facts.warmup_label,
            policy_present_count: measured.presentCount,
            refreshes_per_present: REFRESHES_PER_PRESENT,
            policy_refresh_count: measured.refreshCount,
            completed_scene_id: facts.completed_scene_id ?? null,
            copied_scene_id: frame.scene_id,
            owner_epoch: facts.owner_epoch,
            scene_polls: facts.scene_polls,
            warp_polls: facts.warp_polls,
            texture_reallocations: facts.texture_reallocations,
            presentation_ledger: stable.presentation_ledger,
          },
          rgba: {
            byte_length: frame.rgba.length,
            digest: { algorithm: "sha256", hex: await sha256(frame.rgba) },
            rows: rgbaRowDigests(frame.rgba, frame.width, frame.height),
            lossless: {
              file: LOSSLESS_FILE,
              encoding: LOSSLESS_ENCODING,
              byte_length: compressed.length,
            },
          },
        };
        const text = JSON.stringify(actual, null, 2);
        if (expected) {
          assert(JSON.stringify(actual) === JSON.stringify(expected), "served whole-grid fixture differs");
          REPORT.textContent = `PASS ${FIXTURE_URL}\n\n${text}`;
        } else {
          const size = compressed.length;
          if (size <= MAX_INLINE_BINARY_BYTES) {
            REPORT.textContent = `${text}\n\nBEGIN ${LOSSLESS_FILE} BASE64 (${size} bytes)\n${base64(compressed)}\nEND ${LOSSLESS_FILE} BASE64`;
          } else {
            REPORT.textContent = `LOSSLESS FIXTURE TOO LARGE: ${size} bytes exceeds ${MAX_INLINE_BINARY_BYTES}; no base64 emitted\n\n${text}`;
          }
        }
      } finally {
        lab.stop();
      }
    }

    run().catch(error => {
      REPORT.textContent = `failed: ${String(error)}`;
      console.error(error);
    });
  </script>
</body>
</html>
