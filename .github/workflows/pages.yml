# pages: after a successful release workflow, deploy the published immutable
# asset at main HEAD. Waiting for release success prevents the main push from
# racing the draft-to-published transition. This workflow never rebuilds source.
name: pages

on:
  workflow_run:
    workflows: [release]
    types: [completed]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy release asset
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - name: select a release tag at main HEAD
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(git for-each-ref --points-at=HEAD --sort=-creatordate --format='%(refname:strip=2)' 'refs/tags/*-*.*.*')
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "pages: no release tag points at main HEAD" >&2
            exit 1
          fi
          TAG=""
          for candidate in "${tags[@]}"; do
            if details="$(gh release view "$candidate" --json isDraft,publishedAt,assets --jq '[.isDraft, (.publishedAt // ""), ([.assets[] | select(.name == "ember-pages.tar.gz")] | length)] | @tsv' 2>/dev/null)"; then
              IFS=$'\t' read -r is_draft published_at asset_count <<< "$details"
            else
              continue
            fi
            if [ "$is_draft" = false ] && [ -n "$published_at" ] && [ "$asset_count" = 1 ]; then
              TAG="$candidate"
              break
            fi
          done
          if [ -z "$TAG" ]; then
            echo "pages: no tag at main HEAD has a published release with exactly one ember-pages.tar.gz asset" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: download the release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pages-release"
          gh release download "$TAG" --pattern ember-pages.tar.gz --dir "$RUNNER_TEMP/pages-release"
          test -f "$RUNNER_TEMP/pages-release/ember-pages.tar.gz"
      - name: extract the release asset
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pages-release/ember-pages.tar.gz"
          tar -tzf "$archive" > "$RUNNER_TEMP/pages-archive.list"
          if grep -Eq '(^/|(^|/)\.\.(/|$))' "$RUNNER_TEMP/pages-archive.list"; then
            echo "pages: release asset contains an unsafe path" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pages-site"
          tar -xzf "$archive" -C "$RUNNER_TEMP/pages-site"
          test -f "$RUNNER_TEMP/pages-site/index.html"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
