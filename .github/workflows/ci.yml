# ci: the required integration gate for pull requests and pushes to develop.
# The focused server tests protect the host runtime, the shell suites protect
# repository and deployment contracts, and the workspace job proves formatting,
# linting and all remaining packages before a commit can integrate.
#
# A pull request gates its synthetic merge commit, while every develop push
# establishes evidence for the exact integrated commit that may later receive
# a release tag. Neither run publishes or promotes its commit. Hosts track main,
# which advances only after the release workflow validates a signed tag, so
# deployed servers and Pages clients remain on the same tagged source.
name: ci

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  servers:
    name: cores + servers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: servers
      # The handling golden quantizes floats to metric tolerances; exact
      # same-platform determinism is tested separately. Run it on Linux too.
      - name: test
        run: >
          cargo test --locked
          -p arena-core -p fire-core -p kings-core -p league-core
          -p arena-server -p fire-server -p kings-server -p league-server
      - name: the host's probes build
        run: |
          cargo build --locked --release -p arena-server --example wsbot
          cargo build --locked --release -p fire-server --example probe
          cargo build --locked --release -p kings-server --example probe
          cargo build --locked --release -p league-server --example wsprobe

  deploy-scripts:
    name: deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: syntax, workflows, rulesets, publish-host, host-pids, host-kings, host-prebuilt, ship-host, host-timer, republish-host, pages, ssh-deploys, watchdog
        run: bash deploy/tests/run.sh syntax workflows rulesets publish-host host-pids host-kings host-prebuilt ship-host host-timer republish-host pages ssh-deploys watchdog
      - name: repository policy suites
        if: github.event_name == 'pull_request'
        run: |
          bash deploy/tests/test-readmes.sh
          bash deploy/tests/test-done-lists.sh
          bash deploy/tests/test-changelog.sh
          bash deploy/tests/test-commit-messages.sh origin/develop

  typed-web:
    name: typed web
    runs-on: ubuntu-latest
    env:
      EMBER_SOURCE_SHA: ${{ github.sha }}
      EMBER_TYPED_WEB_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
      - name: toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: typed-web
      - name: install locked TypeScript toolchain
        run: npm ci
      - name: verify pinned TypeScript toolchain
        run: bash deploy/check-toolchain.sh
      - name: install matching wasm-bindgen CLI
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import pathlib
          import tomllib

          with pathlib.Path("Cargo.lock").open("rb") as stream:
              lock = tomllib.load(stream)
          versions = {package["version"] for package in lock["package"] if package["name"] == "wasm-bindgen"}
          if len(versions) != 1:
              raise SystemExit("typed web: Cargo.lock does not contain exactly one wasm-bindgen version")
          print(versions.pop())
          PY
          )"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: generate and compile declarations
        run: |
          cargo run --locked -p ember-webgen --release -- --out "target/web-generated/$EMBER_SOURCE_SHA"
          bash deploy/stage-wasm-types.sh "$EMBER_SOURCE_SHA"
          npx --no-install tsc -p tsconfig.web.json --noEmit
      - name: typed web fixtures
        run: bash deploy/tests/test-typescript.sh

  workspace:
    name: workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Mesa lavapipe supplies the software Vulkan adapter that engine GPU readback tests need on GPU-less runners.
      - name: native build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libudev-dev libasound2-dev mesa-vulkan-drivers
      - name: toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: workspace tests
        run: cargo test --workspace --locked --exclude linter
