# ci: the required integration gate for pull requests and pushes to develop.
# The focused server tests protect the host runtime, the shell suites protect
# repository and deployment contracts, and the workspace job proves formatting,
# linting and all remaining packages before a commit can integrate.
#
# A green run establishes evidence for the exact develop commit; it does not
# publish or promote that commit. Hosts track main, which advances only after
# the release workflow validates a signed tag, so deployed servers and Pages
# clients remain on the same tagged source.
name: ci

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - 'marketing/**'
      - '**.md'
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  servers:
    name: cores + servers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: servers
      # The handling golden quantizes floats to metric tolerances; exact
      # same-platform determinism is tested separately. Run it on Linux too.
      - name: test
        run: >
          cargo test --locked
          -p arena-core -p fire-core -p kings-core -p league-core
          -p arena-server -p fire-server -p kings-server -p league-server
      - name: the host's probes build
        run: |
          cargo build --locked --release -p arena-server --example wsbot
          cargo build --locked --release -p fire-server --example probe
          cargo build --locked --release -p kings-server --example probe
          cargo build --locked --release -p league-server --example wsprobe

  deploy-scripts:
    name: deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: syntax, publish-host, host-pids, host-kings, host-prebuilt, ship-host, host-timer, republish-host, pages, ssh-deploys, watchdog
        run: bash deploy/tests/run.sh syntax publish-host host-pids host-kings host-prebuilt ship-host host-timer republish-host pages ssh-deploys watchdog
      - name: repository policy suites
        if: github.event_name == 'pull_request'
        run: |
          bash deploy/tests/test-readmes.sh
          bash deploy/tests/test-done-lists.sh
          bash deploy/tests/test-changelog.sh
          bash deploy/tests/test-commit-messages.sh origin/develop

  workspace:
    name: workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: workspace tests
        run: cargo test --workspace --locked --exclude linter --exclude ember-julibrot-present
      - name: presentation tests
        run: cargo test -p ember-julibrot-present -- --test-threads=1
