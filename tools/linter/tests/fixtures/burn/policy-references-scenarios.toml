namespace = "com.torrust.index.linter.policy.references.scenarios"
version = [1, 0, 0]

[set.numbered-marks]
fictional-scenarios = { mark = "@", minimum = 2, maximum = 7 }

[owners.QUARRY]
prose = '%s"packages/quarry/" ( %s"docs" / %s"notes" / %s"src" / %s"tests" ) [ "/" *VCHAR ]'
code = '%s"packages/quarry/" ( %s"src" / %s"tests" / %s"benches" / %s"examples" ) [ "/" *VCHAR ]'

[owners.QUARRY.numbered-marks]
include = [
  { name = "quarry-tree", numbered-marks = "fictional-scenarios", pattern = '%s"packages/quarry" [ "/" *VCHAR ]' },
]
