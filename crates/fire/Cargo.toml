[package]
name = "fire"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Distinct name so the bin's debug artifacts don't collide with the cdylib's.
[[bin]]
name = "fire-app"
path = "src/main.rs"

[dependencies]
ember-engine = { path = "../ember-engine" }

[lints]
workspace = true
fire-core = { path = "../fire-core" }
glam.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "WebSocket", "MessageEvent", "Event", "CloseEvent", "ErrorEvent",
    "Document", "Window", "Element",
] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite.workspace = true

[dev-dependencies]
# The online tests drive a real server over a real socket.
fire-server = { path = "../fire-server" }
# So the server's dropped-message warnings surface in test output.
tracing-subscriber.workspace = true
ember-engine = { path = "../ember-engine" }
