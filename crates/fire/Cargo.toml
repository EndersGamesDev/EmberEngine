[package]
name = "fire"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Distinct name so the bin's debug artifacts don't collide with the cdylib's.
[[bin]]
name = "fire-app"
path = "src/main.rs"

[dependencies]
ember-client-net = { path = "../ember-client-net" }
ember-engine = { path = "../ember-engine" }
fire-core = { path = "../fire-core" }
glam.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
# The online tests drive a real server over a real socket.
fire-server = { path = "../fire-server" }
# So the server's dropped-message warnings surface in test output.
tracing-subscriber.workspace = true
ember-engine = { path = "../ember-engine" }

[lints]
workspace = true
