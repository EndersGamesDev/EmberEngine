[package]
name = "ember-engine"
edition.workspace = true
version.workspace = true

[dependencies]
winit.workspace = true
wgpu.workspace = true
glam.workspace = true
tracing.workspace = true
bytemuck.workspace = true
gltf = "1"
# std::time::Instant panics on wasm; web-time is std on native, Performance
# on the web.
web-time = "1"

# PNG decode for textures (pure Rust; used by native tooling paths and by
# games embedding texture bytes on wasm).
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true
# Debug overlay (ATW test rig): egui 0.31 pairs with wgpu 24 / winit 0.30.
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl"] }
log.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement"] }

[lints]
workspace = true
