[package]
name = "pong"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Distinct name so the bin's debug artifacts don't collide with the cdylib's.
[[bin]]
name = "pong-app"
path = "src/main.rs"

[dependencies]
ember-engine = { path = "../ember-engine" }
glam.workspace = true
log.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
