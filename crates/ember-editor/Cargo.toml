[package]
name = "ember-editor"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Distinct name so the bin's debug artifacts don't collide with the cdylib's
# — the same reason crates/arena names its bin arena-app.
[[bin]]
name = "ember-editor-app"
path = "src/main.rs"

[dependencies]
ember-engine = { path = "../ember-engine" }
# The editor authors sim data, so it speaks the sim's own types rather
# than a parallel format that would have to be kept in step.
arena-core = { path = "../arena-core" }
glam.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber.workspace = true

[lints]
workspace = true
