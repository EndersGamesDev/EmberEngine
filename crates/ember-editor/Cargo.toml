[package]
name = "ember-editor"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Distinct name so the bin's debug artifacts don't collide with the cdylib's
# — the same reason crates/pong names its bin pong-app.
[[bin]]
name = "ember-editor-app"
path = "src/main.rs"

[dependencies]
ember-engine = { path = "../ember-engine" }
glam.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber.workspace = true
