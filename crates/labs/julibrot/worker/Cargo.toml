[package]
name = "ember-julibrot-worker"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ember-julibrot-math = { path = "../math" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ember-lab-heap = { path = "../../heap" }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "MessageEvent", "Performance", "WorkerGlobalScope"] }

[lints]
workspace = true
