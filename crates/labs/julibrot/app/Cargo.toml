[package]
name = "ember-julibrot-app"
edition.workspace = true
version.workspace = true

[lib]
name = "ember_lab_julibrot"
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck.workspace = true
ember-julibrot-kernels = { path = "../kernels" }
ember-julibrot-math = { path = "../math" }
ember-julibrot-present = { path = "../present" }
ember-julibrot-worker = { path = "../worker" }
ember-lab-heap = { path = "../../heap" }
serde.workspace = true
# float_roundtrip: a saved view must survive its own JSON exactly. Without it serde_json's fast
# parse path can land one unit in the last place away, and a reloaded row would be a different row.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
wgpu = { workspace = true, features = ["webgl", "wgsl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Document", "Element", "HtmlCanvasElement", "Performance", "WebGl2RenderingContext", "Window"] }

[lints]
workspace = true
