[package]
name = "arena"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Distinct name so the bin's debug artifacts don't collide with the cdylib's.
[[bin]]
name = "arena-app"
path = "src/main.rs"

[dependencies]
ember-engine = { path = "../ember-engine" }
arena-core = { path = "../arena-core" }
glam.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
rustls.workspace = true
rodio = { version = "0.19", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "WebSocket", "MessageEvent", "Event", "CloseEvent", "ErrorEvent",
    "Document", "Window", "Element", "Node",
    "AudioContext", "AudioBuffer", "AudioBufferSourceNode",
    "AudioDestinationNode", "AudioNode", "GainNode", "AudioParam",
    "StereoPannerNode",
] }

[lints]
workspace = true
